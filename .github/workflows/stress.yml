name: Stress

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  stress:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fluxion
          POSTGRES_PASSWORD: fluxion
          POSTGRES_DB: fluxion_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fluxion -d fluxion_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://fluxion:fluxion@localhost:5432/fluxion_test
      TEST_DATABASE_URL: postgresql+asyncpg://fluxion:fluxion@localhost:5432/fluxion_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-not-a-production-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade -c requirements-ci.txt pip
      - run: python -m pip install -c requirements-ci.txt hatchling
      - run: python -m pip install --no-build-isolation -c requirements-ci.txt -e ".[dev]"
      - run: alembic upgrade head
      - run: python -m pytest -m stress -v
