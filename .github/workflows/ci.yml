name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  DATABASE_URL: postgresql+asyncpg://fluxion:fluxion@localhost:5432/fluxion_test
  TEST_DATABASE_URL: postgresql+asyncpg://fluxion:fluxion@localhost:5432/fluxion_test
  REDIS_URL: redis://localhost:6379/0
  JWT_SECRET: ci-only-not-a-production-secret

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --upgrade -c requirements-ci.txt pip
      - run: python -m pip install -c requirements-ci.txt hatchling
      - run: python -m pip install --no-build-isolation -c requirements-ci.txt -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m compileall app tests alembic scripts
      - run: python scripts/check_migrations.py

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --upgrade -c requirements-ci.txt pip
      - run: python -m pip install -c requirements-ci.txt hatchling
      - run: python -m pip install --no-build-isolation -c requirements-ci.txt -e ".[dev]"
      - run: python -m pytest -m "not integration and not chaos and not stress" -v

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fluxion
          POSTGRES_PASSWORD: fluxion
          POSTGRES_DB: fluxion_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fluxion -d fluxion_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --upgrade -c requirements-ci.txt pip
      - run: python -m pip install -c requirements-ci.txt hatchling
      - run: python -m pip install --no-build-isolation -c requirements-ci.txt -e ".[dev]"
      - run: alembic upgrade head
      - run: python -m pytest -m "integration and not chaos and not stress" -v

  chaos:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fluxion
          POSTGRES_PASSWORD: fluxion
          POSTGRES_DB: fluxion_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fluxion -d fluxion_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --upgrade -c requirements-ci.txt pip
      - run: python -m pip install -c requirements-ci.txt hatchling
      - run: python -m pip install --no-build-isolation -c requirements-ci.txt -e ".[dev]"
      - run: alembic upgrade head
      - run: python -m pytest -m chaos -v

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fluxion
          POSTGRES_PASSWORD: fluxion
          POSTGRES_DB: fluxion_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fluxion -d fluxion_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --upgrade -c requirements-ci.txt pip
      - run: python -m pip install -c requirements-ci.txt hatchling
      - run: python -m pip install --no-build-isolation -c requirements-ci.txt -e .
      - run: python scripts/check_migrations.py
      - run: alembic upgrade head
      - run: alembic current
      - run: alembic downgrade -1
      - run: alembic upgrade head

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --upgrade -c requirements-ci.txt pip
      - run: python -m pip install -c requirements-ci.txt hatchling
      - run: python -m pip install --no-build-isolation -c requirements-ci.txt -e ".[dev]"
      - run: python -m build --no-isolation
      - run: python -m venv .package-venv
      - run: .package-venv/bin/python -m pip install -c requirements-ci.txt dist/*.whl
      - run: .package-venv/bin/fluxion --version
      - run: .package-venv/bin/fluxion --help
      - run: |
          for command in fluxion-api fluxion-scheduler fluxion-publisher fluxion-reaper fluxion-worker fluxion-demo; do
            test -x ".package-venv/bin/$command"
            ".package-venv/bin/$command" --help
          done
      - uses: actions/upload-artifact@v4
        with:
          name: fluxion-dist
          path: dist/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: docker build -t fluxion:ci .
      - run: docker run --rm fluxion:ci fluxion --help
      - run: docker compose config
      - name: Compose smoke
        env:
          AUTH_ENABLED: "false"
          JWT_SECRET: ci-only-not-a-production-secret
          DISPATCH_QUEUE_NAME: fluxion:ci:dispatch
        run: |
          docker compose up -d --build
          trap 'docker compose down -v' EXIT
          python scripts/ci_smoke.py --api-url http://127.0.0.1:8001 --timeout 90
          docker compose run --rm --no-deps api fluxion-demo --api-url http://api:8000
